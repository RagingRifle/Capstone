# Scenario: Ramp — Gradually increasing workload
name: ramp
description: "Traffic ramps from low to high, simulating peak-hour load buildup"
workload:
  pattern: ramp
  ramp_start_rate: 0.5
  ramp_end_rate: 12.0
  ramp_duration_s: 90.0
  size_kb_range: [50, 2048]
  complexity_range: [1, 10]
  deadline_ms_range: [150, 2000]
network:
  edge1_latency_ms: 5.0
  edge1_bw_mbps: 200.0
  edge2_latency_ms: 8.0
  edge2_bw_mbps: 150.0
  cloud_latency_ms: 80.0
  cloud_bw_mbps: 1000.0
nodes:
  edge1_cores: 4
  edge1_speed_ghz: 2.0
  edge2_cores: 4
  edge2_speed_ghz: 2.2
  cloud_cores: 16
  cloud_speed_ghz: 3.5
simulation:
  duration_s: 120
  sim_speed: 0
